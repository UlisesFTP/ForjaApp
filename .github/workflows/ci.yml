# Continuous integration for FORJA. Nothing here publishes to a store or uses
# production signing keys. Release builds are compile checks signed with the
# debug key (FORJA_ALLOW_DEBUG_SIGNING) and are not uploaded.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the version recorded in docs/CONTEXTO.md.
  FLUTTER_VERSION: "3.47.5"

jobs:
  quality:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Generated code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- lib test drift_schemas
      - name: Tests
        run: flutter test --coverage
      - name: Keep coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  android:
    name: Android build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # android/local.properties is machine-specific and ignored; Flutter
      # writes it for this runner.
      - run: flutter pub get
      - name: Debug APK
        run: flutter build apk --debug
      - name: Release build (compile check, debug-signed, not uploaded)
        env:
          FORJA_ALLOW_DEBUG_SIGNING: "1"
        run: flutter build apk --release
      - name: A release without a key is refused
        run: |
          if flutter build apk --release; then
            echo "A release build without android/key.properties must fail"; exit 1
          fi

  ios:
    name: iOS build (needs a macOS runner)
    runs-on: macos-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build without signing
        run: flutter build ios --debug --no-codesign
