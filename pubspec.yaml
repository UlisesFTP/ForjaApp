name: forja_app
description: FORJA. Rutinas de gimnasio, interfaz móvil MVVM y almacenamiento local.
publish_to: none
version: 0.9.0+2
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  crypto: ^3.0.7
  file_picker: ^13.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device frame profile (integration_test/perf_test.dart); ships with the SDK.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1
  shared_preferences_platform_interface: ^2.4.2
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-DMSans.txt
    - assets/fonts/OFL-BarlowCondensed.txt
    - assets/images/forja-icon.png
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
